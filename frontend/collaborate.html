<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Collaborative IDE</title>
    
    <!-- CodeMirror Core CSS & Dracula Dark Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 40px; 
        }
        h2 { color: #58a6ff; margin-top: 0; }
        .status-badge { font-size: 14px; color: #3fb950; margin-left: 10px; }
        
        .CodeMirror {
            height: 450px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-size: 16px;
            font-family: 'Consolas', 'Courier New', monospace;
        }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 15px;">
        <!-- Left Side: Back Button & Room Name -->
        <div style="display: flex; align-items: center; gap: 15px; white-space: nowrap;">
            <button onclick="window.location.href='student-dashboard.html'" style="padding: 8px 12px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-weight: bold;">
                ⬅ Back
            </button>
            <h2 style="margin: 0; display: flex; align-items: center; gap: 10px;">
                Room: <span id="roomNameDisplay" style="color: #c9d1d9;">Python-101</span> 
                <span class="status-badge" id="status" style="margin: 0;">(Connecting...)</span>
            </h2>
        </div>
        
        <!-- Right Side: Action Buttons -->
        <div style="display: flex; gap: 10px;">
            <button id="aiBtn" style="padding: 10px 20px; background: #6e40c9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;">
                ✨ Ask AI Tutor
            </button>
            <button onclick="saveMyCode()" style="padding: 10px 20px; background: #2ea043; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;">
                💾 Save Code
            </button>
            <button id="runBtn" style="padding: 10px 20px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;">
                ▶ Run Code
            </button>
        </div>
    </div>
    
    <textarea id="codeEditor"></textarea>

    <!-- AI Feedback Panel -->
    <div id="aiPanel" style="display: none; background: #21262d; border-left: 4px solid #8957e5; padding: 15px; margin-top: 20px; border-radius: 8px; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; white-space: pre-wrap; line-height: 1.5;"></div>

    <!-- NEW: Interactive Real-Time Terminal -->
    <h3 style="margin-top: 20px; color: #8b949e;">Interactive Terminal</h3>
    <div style="background: #010409; padding: 15px; border-radius: 8px; border: 1px solid #30363d; min-height: 150px; display: flex; flex-direction: column;">
        <pre id="terminal" style="color: #c9d1d9; font-family: 'Consolas', monospace; white-space: pre-wrap; margin: 0;"></pre>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <span style="color: #3fb950; font-family: 'Consolas', monospace; font-weight: bold;">></span>
            <input type="text" id="liveInput" placeholder="Type here and press Enter to send to the running script..." style="flex-grow: 1; background: transparent; border: none; color: #c9d1d9; font-family: 'Consolas', monospace; outline: none; font-size: 14px;">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <script>
        const editorElement = document.getElementById('codeEditor');
        const editor = CodeMirror.fromTextArea(editorElement, {
            mode: "python", theme: "dracula", lineNumbers: true, indentUnit: 4, matchBrackets: true
        });
        editor.setSize(null, 450); 

        const statusText = document.getElementById('status');
        const terminal = document.getElementById('terminal');
        const liveInput = document.getElementById('liveInput');
        const runBtn = document.getElementById('runBtn');
        const aiBtn = document.getElementById('aiBtn');
        const aiPanel = document.getElementById('aiPanel');
        
        // 1. Collaborative Coding WebSocket
        const urlParams = new URLSearchParams(window.location.search);
        const currentRoom = urlParams.get('room') || 'Public-Lobby';
        document.getElementById('roomNameDisplay').textContent = currentRoom;
        
        const ws = new WebSocket(`wss://ai-code-platform-4mbf.onrender.com/ws/code/${currentRoom}`);

        ws.onopen = () => {
            statusText.textContent = "(🟢 Live)";
            if (!editor.getValue()) {
                editor.setValue("print('Welcome to the Interactive Terminal!')\nname = input('What is your name? ')\nprint(f'Hello, {name}!')");
            }
        };

        editor.on('change', (instance, changeObj) => {
            if (changeObj.origin !== 'setValue') ws.send(instance.getValue());
        });

        ws.onmessage = (event) => {
            if (editor.getValue() !== event.data) {
                const cursor = editor.getCursor();
                editor.setValue(event.data);
                editor.setCursor(cursor);
            }
        };

        // 2. Real-Time Execution Engine with UI State
        let execWs = null;

        runBtn.addEventListener('click', () => {
            // --- NEW: Disable button to prevent spam clicks ---
            runBtn.disabled = true;
            runBtn.innerHTML = "⏳ Running...";
            runBtn.style.cursor = "not-allowed";
            runBtn.style.opacity = "0.7";

            terminal.style.color = '#c9d1d9';
            terminal.textContent = "Connecting to execution engine...\n";
            liveInput.focus();
            
            if (execWs) execWs.close();
            execWs = new WebSocket('wss://ai-code-platform-4mbf.onrender.com/api/execute/ws/run');

            execWs.onopen = () => {
                terminal.textContent = ""; 
                execWs.send(JSON.stringify({ code: editor.getValue() }));
            };

            execWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "stdout") {
                    terminal.style.color = '#c9d1d9';
                    terminal.textContent += msg.data;
                } else if (msg.type === "stderr") {
                    terminal.style.color = '#ff7b72';
                    terminal.textContent += msg.data;
                }
            };

            execWs.onerror = () => {
                terminal.style.color = '#ff7b72';
                terminal.textContent += "\nError: Connection to execution server failed.";
            };
            
            execWs.onclose = () => {
                terminal.style.color = '#8b949e';
                terminal.textContent += "\n[Process Exited]";
                
                // --- NEW: Re-enable the button when finished ---
                runBtn.disabled = false;
                runBtn.innerHTML = "▶ Run Code";
                runBtn.style.cursor = "pointer";
                runBtn.style.opacity = "1";
            };
        });

        // 3. NEW: Send Input from the interactive prompt to the running script
        liveInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = liveInput.value;
                terminal.textContent += text + "\n"; // Echo user typing in the terminal
                
                if (execWs && execWs.readyState === WebSocket.OPEN) {
                    execWs.send(text);
                }
                
                liveInput.value = ''; // Clear the input box immediately
            }
        });

        // 4. AI Tutor Logic with UI State
        aiBtn.addEventListener('click', async () => {
            // --- NEW: Disable button while waiting for Gemini API ---
            aiBtn.disabled = true;
            aiBtn.innerHTML = "⏳ Thinking...";
            aiBtn.style.cursor = "not-allowed";
            aiBtn.style.opacity = "0.7";

            aiPanel.style.display = 'block';
            aiPanel.innerHTML = "<em>✨ AI Tutor is reading your code...</em>";
            
            try {
                const response = await fetch('https://ai-code-platform-4mbf.onrender.com/api/ai/analyze', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: editor.getValue() })
                });
                const data = await response.json();
                aiPanel.innerHTML = data.analysis.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            } catch (err) {
                aiPanel.innerHTML = "<span style='color: #ff7b72'>Error connecting to AI Tutor.</span>";
            } finally {
                // --- NEW: Re-enable the button after AI replies ---
                aiBtn.disabled = false;
                aiBtn.innerHTML = "✨ Ask AI Tutor";
                aiBtn.style.cursor = "pointer";
                aiBtn.style.opacity = "1";
            }
        });

        // 5. Save Code Logic
        async function saveMyCode() {
            const currentCode = editor.getValue();
            const userEmail = localStorage.getItem("user_email") || "student1@example.com"; 
            
            try {
                const response = await fetch("https://ai-code-platform-4mbf.onrender.com/api/snippets/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: `Saved from ${currentRoom}`,
                        code: currentCode,
                        language: "python",
                        user_email: userEmail
                    })
                });

                if (response.ok) alert("✅ Code successfully saved to database!");
                else alert("❌ Failed to save code.");
            } catch (error) {
                console.error("Error saving code:", error);
            }
        }
    </script>
</body>
</html>
