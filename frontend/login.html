<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Code Platform</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #161b22; 
            padding: 2.5rem; 
            border-radius: 12px; 
            width: 320px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            border: 1px solid #30363d;
        }
        h2 { text-align: center; margin-top: 0; color: #58a6ff; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background-color: #0d1117;
            color: white;
            box-sizing: border-box; 
        }
        input:focus { outline: none; border-color: #58a6ff; }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px;
            background: #238636; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
        }
        button:hover { background: #2ea043; }
        .message { text-align: center; margin-top: 15px; font-size: 0.9em; display: none; }
        .error { color: #ff7b72; }
        .success { color: #3fb950; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>
    <div id="statusMessage" class="message"></div>
    <div style="text-align: center; margin-top: 20px; font-size: 0.9em;">
        Don't have an account? <a href="index.html">Register</a>
    </div>
</div>

<!-- JavaScript will go here -->
 <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const statusMsg = document.getElementById('statusMessage');
        
        statusMsg.style.display = 'block';
        statusMsg.className = 'message'; 
        statusMsg.textContent = 'Logging in...';

        // FastAPI's OAuth2PasswordRequestForm requires URL encoded data
        const formData = new URLSearchParams();
        formData.append('username', email); // Must be 'username'
        formData.append('password', password);

        try {
            const response = await fetch('https://ai-code-platform-4mbf.onrender.com/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                statusMsg.className = 'message success';
                statusMsg.textContent = 'Login successful! Redirecting...';
                
                // Save the digital VIP pass (JWT token) to the browser
                localStorage.setItem('token', data.access_token);
                
                // Redirect to the dashboard after 1 second
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 1000);
            } else {
                statusMsg.className = 'message error';
                statusMsg.textContent = data.detail || 'Invalid email or password.';
            }
        } catch (error) {
            statusMsg.className = 'message error';
            statusMsg.textContent = 'Server error. Is the backend running?';
        }
    });
</script>

</body>
</html>
