<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Admin - AI Code Platform</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            display: flex;
            height: 100vh;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 { color: #d2a8ff; margin-top: 0; margin-bottom: 30px; font-size: 1.2rem; }
        .nav-item {
            padding: 12px 15px; margin-bottom: 10px; background-color: #21262d;
            border-radius: 6px; cursor: pointer; border: 1px solid transparent;
        }
        .nav-item.active { border-color: #d2a8ff; color: #d2a8ff; font-weight: bold; }
        .nav-item:hover { background-color: #30363d; }
        .spacer { flex-grow: 1; }
        .logout-btn {
            padding: 12px; background-color: #da3633; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        /* Main Content Styles */
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .welcome-banner {
            background: linear-gradient(135deg, #8957e5, #d2a8ff);
            border-radius: 12px; padding: 30px; margin-bottom: 30px; color: white;
        }
        .welcome-banner h1 { margin: 0 0 10px 0; color: #0d1117; }
        .welcome-banner p { margin: 0; font-size: 1.1rem; color: #0d1117; opacity: 0.9; }
        
        .student-card {
            background: #21262d; padding: 20px; border-radius: 8px; 
            border: 1px solid #30363d; margin-bottom: 20px;
        }
        .student-header { display: flex; justify-content: space-between; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        .student-email { color: #58a6ff; font-weight: bold; }
        .language-badge { background: #3fb950; color: #0d1117; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .code-block { background: #010409; padding: 15px; border-radius: 6px; font-family: Consolas, monospace; overflow-x: auto; margin: 0; color: #c9d1d9;}
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>👨‍🏫 Admin Portal</h2>
        <div class="nav-item active">Student Submissions</div>
        <div class="nav-item">Manage Rooms</div>
        <div class="nav-item" onclick="window.location.href='collaborate.html?room=Teacher-Lobby'">Open IDE</div>
        <div class="spacer"></div>
        <button id="logoutBtn" class="logout-btn">Log Out</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="welcome-banner">
            <h1>Teacher Dashboard</h1>
            <p>Review and grade student code submissions across the platform.</p>
        </div>

        <h3 style="color: #c9d1d9; border-bottom: 1px solid #30363d; padding-bottom: 10px;">📚 All Student Projects</h3>
        <div id="submissionsList" style="margin-top: 20px;">
            <p style="color: #8b949e;">Loading student submissions...</p>
        </div>
    </div>

    <script>
        // Security Check
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        // Fetch ALL snippets from the new admin route
        async function loadAllSubmissions() {
            const submissionsList = document.getElementById("submissionsList");
            try {
                const response = await fetch(`https://ai-code-platform-4mbf.onrender.com/api/snippets/all`);
                const snippets = await response.json();

                if (snippets.length === 0) {
                    submissionsList.innerHTML = "<p style='color: #8b949e;'>No student submissions found in the database.</p>";
                    return;
                }

                submissionsList.innerHTML = ""; 
                
                snippets.forEach(snippet => {
                    const card = document.createElement("div");
                    card.className = "student-card";
                    card.innerHTML = `
                        <div class="student-header">
                            <div>
                                <span class="student-email">👤 ${snippet.user_email}</span>
                                <span style="color: #8b949e; margin-left: 10px;">submitted: <strong>${snippet.title}</strong></span>
                            </div>
                            <span class="language-badge">${snippet.language.toUpperCase()}</span>
                        </div>
                        <pre class="code-block">${snippet.code}</pre>
                        <div style="margin-top: 15px; text-align: right;">
                            <button style="padding: 8px 15px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">✅ Mark as Graded</button>
                        </div>
                    `;
                    submissionsList.appendChild(card);
                });
            } catch (error) {
                submissionsList.innerHTML = "<p style='color: #ff7b72;'>Error loading submissions.</p>";
                console.error("Fetch error:", error);
            }
        }

        window.onload = loadAllSubmissions;

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user_email');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
